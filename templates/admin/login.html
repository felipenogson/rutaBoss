<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — RutaBoss</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
<main>
  <div class="container" style="max-width:360px;padding-top:4rem;">
    <h1 class="text-center mb-2">ADMIN</h1>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul class="flash-messages">
          {% for msg in messages %}<li class="flash-msg">{{ msg }}</li>{% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <div class="card">
      <div class="card-body">
        <form method="post">
          <div class="form-group">
            <label class="form-label">USUARIO</label>
            <input type="text" name="username" class="form-control" autocomplete="username" required>
          </div>
          <div class="form-group">
            <label class="form-label">CONTRASEÑA</label>
            <input type="password" name="password" class="form-control" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-gold" style="width:100%;justify-content:center;">ENTRAR</button>
        </form>
      </div>
    </div>
  </div>
</main>
</body>
</html>
